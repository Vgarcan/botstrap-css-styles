# Publish the existing Bootstrap theme showcase after every merge to main.
# GitHub Pages must first be enabled in Settings > Pages > Source: GitHub Actions.
name: Deploy theme laboratory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and publish static gallery
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify theme references and files
        run: python3 scripts/verify_site.py

      # Publish only website assets, not repository notes or source control files.
      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R themes _site/themes
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
